<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LearnScroll</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #111;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  #feed {
    height: 100vh;
    height: 100dvh;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
    padding-top: 4.2rem;
    padding-right: 5.5rem;
  }
  .card {
    height: calc(100vh - 4.2rem);
    height: calc(100dvh - 4.2rem);
    scroll-snap-align: start;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem 1.5rem 2rem;
    background: #111;
  }
  .card-inner {
    width: 100%;
    max-width: 680px;
    background: #0a0a0a;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.08);
    padding: 2.2rem 2rem 1.8rem;
    position: relative;
    min-height: 340px;
    max-height: 78vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
  }
  .card.understood .card-inner {
    background: #0d1a12;
    border-color: rgba(34,197,94,0.25);
  }
  .type-badge {
    position: absolute;
    top: 1rem;
    left: 1.2rem;
    padding: 0.28rem 0.7rem;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 600;
  }
  .type-badge.post { background: rgba(251,191,36,0.15); color: #fbbf24; }
  .type-badge.article { background: rgba(167,139,250,0.18); color: #c4b5fd; }
  .topic-tag {
    position: absolute;
    top: 1rem;
    right: 1.2rem;
    font-size: 0.72rem;
    color: #7dd3fc;
    background: rgba(125,211,252,0.1);
    padding: 0.25rem 0.6rem;
    border-radius: 999px;
  }
  .meta {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    font-size: 0.88rem;
    color: #bbb;
    margin-bottom: 0.7rem;
    margin-top: 1.6rem;
  }
  .avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, #7dd3fc, #a78bfa);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    font-weight: 700;
  }
  .source {
    font-size: 0.72rem;
    color: #888;
    margin-left: auto;
  }
  .content {
    font-size: 1.15rem;
    line-height: 1.6;
    margin-bottom: 1rem;
  }
  .card.article .content {
    font-size: 1.02rem;
    line-height: 1.68;
  }
  .content strong { color: #fff; }
  .actions {
    position: absolute;
    right: 1rem;
    bottom: 1rem;
    display: flex;
    gap: 0.45rem;
  }
  .action-btn {
    background: rgba(255,255,255,0.08);
    border: none;
    color: #fff;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    font-size: 1.05rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .action-btn:hover { background: rgba(255,255,255,0.16); }
  .action-btn.saved { background: #fbbf24; color: #000; }
  .action-btn.done { background: #22c55e; color: #000; }
  .progress-bar {
    position: fixed;
    top: 0; left: 0;
    height: 3px;
    background: #7dd3fc;
    width: 0%;
    z-index: 100;
    transition: width 0.25s ease;
  }
  .top-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 4.2rem;
    padding: 0.5rem 1.4rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 0.4rem;
    background: #111;
    z-index: 50;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .logo { font-weight: 700; font-size: 1.1rem; }
  .counter { font-size: 0.82rem; color: #aaa; }
  .topic-row {
    display: flex;
    gap: 0.4rem;
    justify-content: center;
    flex-wrap: wrap;
  }
  .topic-btn {
    background: rgba(255,255,255,0.06);
    border: none;
    color: #ccc;
    padding: 0.3rem 0.7rem;
    border-radius: 999px;
    font-size: 0.75rem;
    cursor: pointer;
    font-weight: 500;
  }
  .topic-btn.active { background: #fff; color: #000; }
  .topic-btn:hover:not(.active) { background: rgba(255,255,255,0.12); }
  .type-sidebar {
    position: fixed;
    right: 0.8rem;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    z-index: 40;
  }
  .filter-btn {
    background: rgba(255,255,255,0.08);
    border: none;
    color: #ccc;
    padding: 0.7rem 0.45rem;
    border-radius: 12px;
    font-size: 0.72rem;
    cursor: pointer;
    font-weight: 600;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    letter-spacing: 0.5px;
    min-height: 5.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .filter-btn.active { background: #fff; color: #000; }
  .filter-btn:hover:not(.active) { background: rgba(255,255,255,0.16); }
</style>
</head>
<body>
<div class="progress-bar" id="progressBar"></div>
<div class="top-bar">
  <div class="top-row">
    <div class="logo">LearnScroll</div>
    <div class="counter" id="counter">1 / 0</div>
  </div>
  <div class="topic-row" id="topicFilters">
    <button class="topic-btn active" data-topic="all">All topics</button>
    <button class="topic-btn" data-topic="physics">Physics</button>
    <button class="topic-btn" data-topic="thermodynamics">Thermodynamics</button>
    <button class="topic-btn" data-topic="fluidmechanics">Fluid Mechanics</button>
    <button class="topic-btn" data-topic="chemistry">Chemistry</button>
    <button class="topic-btn" data-topic="biology">Biology</button>
    <button class="topic-btn" data-topic="calculus">Calculus</button>
  </div>
</div>
<div class="type-sidebar" id="typeFilters">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="post">Posts</button>
  <button class="filter-btn" data-filter="article">Articles</button>
</div>
<div id="feed"></div>

<script>
const allItems = [
  { type: "post", topic: "biology", source: "YouTube", text: "<strong>Photosynthesis in 60 seconds</strong><br><br>Plants take in CO₂ + water + light → make glucose + release oxygen. That’s the whole energy engine of life in one reaction. Scroll for the details." },
  { type: "post", topic: "physics", source: "X", text: "<strong>F = ma is undefeated</strong><br><br>Double the force, double the acceleration. Double the mass, half the acceleration. Every rocket, car, and falling apple still obeys this." },
  { type: "post", topic: "thermodynamics", source: "Instagram", text: "<strong>You can’t win, you can’t break even, you can’t get out of the game</strong><br><br>The three laws of thermodynamics, summarized. Energy is conserved, entropy increases, and absolute zero is unreachable." },
  { type: "article", topic: "biology", source: "YouTube", text: "<strong>Photosynthesis and cellular respiration explained</strong><br><br>These two processes are the energy cycle of life. Photosynthesis stores sunlight as chemical energy in glucose. Cellular respiration releases that energy as ATP so cells can work.<br><br>In photosynthesis, light reactions in the thylakoids split water and generate ATP + NADPH. The Calvin cycle in the stroma then fixes CO₂ into sugar. Oxygen is the waste product we breathe.<br><br>Respiration reverses it: glycolysis, Krebs cycle, and the electron transport chain turn glucose back into CO₂, water, and usable ATP. Together they keep ecosystems running.<br><br>This is why protecting plants protects the base of almost every food chain." },
  { type: "post", topic: "chemistry", source: "X", text: "<strong>Balancing equations is just atom accounting</strong><br><br>Atoms aren’t created or destroyed in chemical reactions — they’re only rearranged. Count them on both sides. That’s the whole rule." },
  { type: "post", topic: "fluidmechanics", source: "Instagram", text: "<strong>Why planes fly</strong><br><br>Faster air over the curved top of a wing = lower pressure. Higher pressure underneath pushes the wing up. Bernoulli in one sentence." },
  { type: "post", topic: "calculus", source: "YouTube", text: "<strong>Derivative = how fast right now</strong><br><br>Slope of the tangent line at one point. Position → velocity. Velocity → acceleration. That’s the entire idea." },
  { type: "article", topic: "thermodynamics", source: "YouTube", text: "<strong>The laws of thermodynamics — full breakdown</strong><br><br>First law: energy is conserved. It changes form but the total stays the same in an isolated system.<br><br>Second law: entropy of an isolated system never decreases. Useful energy spreads out. This is why heat engines can never be 100% efficient and why time has a direction.<br><br>Third law: entropy approaches a minimum (often taken as zero for a perfect crystal) as temperature approaches absolute zero. Absolute zero itself is unreachable.<br><br>These three statements limit every engine, refrigerator, chemical reaction, and living cell. No design can break them." },
  { type: "post", topic: "physics", source: "Instagram", text: "<strong>Energy only changes form</strong><br><br>Kinetic ↔ potential. Chemical → thermal. Light → chemical bonds in plants. The total never appears or disappears." },
  { type: "post", topic: "biology", source: "X", text: "<strong>Cells are the unit of life</strong><br><br>Every organism is made of one or more cells. They take in nutrients, make energy, respond to the environment, and reproduce. That’s the definition." },
  { type: "article", topic: "fluidmechanics", source: "YouTube", text: "<strong>Fluid mechanics essentials</strong><br><br>Fluids (liquids and gases) cannot resist shear stress when at rest — they flow. Pressure at a point acts equally in all directions (Pascal).<br><br>Archimedes: buoyant force equals the weight of the displaced fluid. Bernoulli: faster flow means lower pressure along a streamline (for ideal cases). Viscosity creates internal friction and decides laminar vs turbulent flow via the Reynolds number.<br><br>These ideas explain blood flow, airplane lift, pipe networks, weather, and hydraulics. Master the basics and a huge range of problems become solvable." },
  { type: "post", topic: "calculus", source: "X", text: "<strong>Integral = total change</strong><br><br>Add up all the tiny pieces. Area under velocity-time = displacement. Area under force-distance = work. That’s accumulation." },
  { type: "post", topic: "thermodynamics", source: "Instagram", text: "<strong>No heat engine is 100% efficient</strong><br><br>Carnot limit depends only on the hot and cold temperatures. Everything real is less efficient than that ideal." },
  { type: "post", topic: "chemistry", source: "YouTube", text: "<strong>Acids donate H⁺, bases accept them</strong><br><br>Brønsted–Lowry in one line. Explains reactions in water and inside living cells." }
];

const feed = document.getElementById('feed');
const progressBar = document.getElementById('progressBar');
const counter = document.getElementById('counter');
const typeBtns = document.querySelectorAll('.filter-btn');
const topicBtns = document.querySelectorAll('.topic-btn');

let currentType = 'all';
let currentTopic = 'all';
let visibleItems = [...allItems];

const STORAGE_KEY = 'learnscroll-topics-v2';
let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
state.understood = state.understood || {};
state.saved = state.saved || {};

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function updateProgress(index) {
  const pct = visibleItems.length ? ((index + 1) / visibleItems.length) * 100 : 0;
  progressBar.style.width = pct + '%';
  counter.textContent = visibleItems.length ? `${index + 1} / ${visibleItems.length}` : '0 / 0';
  saveState();
}

function render() {
  feed.innerHTML = '';
  visibleItems = allItems.filter(item => {
    const typeOk = currentType === 'all' || item.type === currentType;
    const topicOk = currentTopic === 'all' || item.topic === currentTopic;
    return typeOk && topicOk;
  });

  if (visibleItems.length === 0) {
    feed.innerHTML = '<div class="card"><div class="card-inner"><div class="content">No content for this combination yet.</div></div></div>';
    updateProgress(0);
    return;
  }

  visibleItems.forEach((item) => {
    const originalIndex = allItems.indexOf(item);
    const el = document.createElement('div');
    el.className = `card ${item.type}` + (state.understood[originalIndex] ? ' understood' : '');
    el.dataset.index = originalIndex;
    const badgeText = item.type === 'post' ? 'Post' : 'Article';
    const topicLabel = item.topic.charAt(0).toUpperCase() + item.topic.slice(1);
    const source = item.source || 'LearnScroll';
    el.innerHTML = `
      <div class="card-inner">
        <div class="type-badge ${item.type}">${badgeText}</div>
        <div class="topic-tag">${topicLabel}</div>
        <div class="meta">
          <div class="avatar">LS</div>
          <div>learnscroll</div>
          <div class="source">via ${source}</div>
        </div>
        <div class="content">${item.text}</div>
        <div class="actions">
          <button class="action-btn ${state.saved[originalIndex] ? 'saved' : ''}" data-action="save">★</button>
          <button class="action-btn ${state.understood[originalIndex] ? 'done' : ''}" data-action="done">✓</button>
        </div>
      </div>
    `;
    feed.appendChild(el);
  });

  updateProgress(0);
  feed.scrollTop = 0;
}

typeBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    typeBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentType = btn.dataset.filter;
    render();
  });
});

topicBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    topicBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTopic = btn.dataset.topic;
    render();
  });
});

render();

let scrollTimeout;
feed.addEventListener('scroll', () => {
  clearTimeout(scrollTimeout);
  scrollTimeout = setTimeout(() => {
    const index = Math.round(feed.scrollTop / (feed.clientHeight || 1));
    if (index >= 0 && index < visibleItems.length) updateProgress(index);
  }, 60);
});

feed.addEventListener('click', (e) => {
  const btn = e.target.closest('.action-btn');
  if (!btn) return;
  const card = btn.closest('.card');
  const originalIndex = Number(card.dataset.index);
  const action = btn.dataset.action;

  if (action === 'done') {
    state.understood[originalIndex] = !state.understood[originalIndex];
    card.classList.toggle('understood', state.understood[originalIndex]);
    btn.classList.toggle('done', state.understood[originalIndex]);
  } else if (action === 'save') {
    state.saved[originalIndex] = !state.saved[originalIndex];
    btn.classList.toggle('saved', state.saved[originalIndex]);
  }
  saveState();
});

document.addEventListener('keydown', (e) => {
  const current = Math.round(feed.scrollTop / (feed.clientHeight || 1));
  if (e.key === 'ArrowDown' || e.key === ' ') {
    e.preventDefault();
    const next = Math.min(current + 1, visibleItems.length - 1);
    feed.children[next]?.scrollIntoView({ behavior: 'smooth' });
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    const prev = Math.max(current - 1, 0);
    feed.children[prev]?.scrollIntoView({ behavior: 'smooth' });
  }
});
</script>
</body>
</html>
