<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LearnScroll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
  :root { --bg: #000; --fg: #fff; --muted: #8a8a8a; --faint: #3a3a3a; --line: #1c1c1c; --accent: #00e676; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--fg); font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  .page { max-width: 760px; margin: 0 auto; padding: 72px 32px 96px; }
  .brand { font-size: 15px; font-weight: 600; letter-spacing: 0.02em; color: var(--muted); }
  .brand b { color: var(--fg); font-weight: 600; }
  h1 { font-size: 40px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; margin: 40px 0 12px; }
  .lead { color: var(--muted); font-size: 18px; line-height: 1.6; }
  .continue { display: inline-flex; align-items: center; gap: 10px; margin-top: 32px; padding: 14px 22px; border: 1px solid var(--accent); color: var(--accent); border-radius: 999px; font-size: 16px; font-weight: 500; }
  .continue:hover { background: rgba(0,230,118,0.08); }
  .continue small { color: var(--muted); font-size: 14px; font-weight: 400; }
  .list { margin-top: 56px; border-top: 1px solid var(--line); }
  .item { display: block; width: 100%; text-align: left; padding: 28px 0; border-bottom: 1px solid var(--line); }
  .item:hover .item-title { color: var(--accent); }
  .item-title { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; transition: color .15s; }
  .item-meta { color: var(--muted); font-size: 15px; margin-top: 6px; }
  .item-desc { color: #c8c8c8; font-size: 16px; line-height: 1.55; margin-top: 10px; }
  .item-progress { font-size: 14px; color: var(--muted); margin-top: 12px; font-variant-numeric: tabular-nums; }
  .item-progress.active { color: var(--accent); }
  .back { color: var(--muted); font-size: 15px; display: inline-block; }
  .back:hover { color: var(--fg); }
  .chap { display: flex; gap: 20px; align-items: baseline; width: 100%; text-align: left; padding: 20px 0; border-bottom: 1px solid var(--line); }
  .chap .num { color: var(--muted); width: 28px; flex: none; font-variant-numeric: tabular-nums; font-size: 15px; }
  .chap .name { flex: 1; font-size: 19px; line-height: 1.4; }
  .chap .info { color: var(--muted); font-size: 14px; flex: none; }
  .chap .info.done { color: var(--accent); }
  .chap:not(.soon):hover .name { color: var(--accent); }
  .chap.soon { cursor: default; }
  .chap.soon .name, .chap.soon .num { color: var(--faint); }
  .chap.soon .info { color: var(--faint); }

  /* Reader */
  .reader { position: fixed; inset: 0; background: var(--bg); }
  .feed { height: 100vh; height: 100dvh; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; }
  .feed::-webkit-scrollbar { display: none; }
  .bar { position: fixed; top: 0; left: 0; right: 0; height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; background: linear-gradient(#000 55%, rgba(0,0,0,0)); z-index: 5; font-size: 14px; color: var(--muted); }
  .bar > * { white-space: nowrap; }
  .bar .where { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60vw; }
  .bar .count { font-variant-numeric: tabular-nums; }
  .line { position: fixed; top: 0; left: 0; height: 2px; background: var(--accent); z-index: 6; transition: width .2s; }
  .card { height: 100vh; height: 100dvh; scroll-snap-align: start; scroll-snap-stop: always; display: flex; align-items: center; justify-content: center; padding: 84px 32px 56px; }
  .card-body { width: 100%; max-width: 680px; max-height: 100%; overflow-y: auto; padding: 4px 0 12px; }
  .sec { color: var(--muted); font-size: 14px; letter-spacing: 0.04em; margin-bottom: 18px; font-variant-numeric: tabular-nums; }
  .card h2 { font-size: 36px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; margin-bottom: 24px; }
  .card p { font-size: 21px; line-height: 1.65; color: #e6e6e6; }
  .eq { margin: 30px 0 4px; font-size: 21px; overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
  .eq .katex-display { margin: 0; text-align: left; }
  .eq .katex-display > .katex { text-align: left; }
  .note { margin-top: 28px; padding-left: 18px; border-left: 2px solid var(--accent); font-size: 18px; line-height: 1.6; color: #d6d6d6; }
  .note .label { display: block; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
  .note.example { border-left-color: var(--faint); }
  .note.example .label { color: var(--muted); }
  .opts { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
  .opt { text-align: left; padding: 16px 20px; border: 1px solid #2a2a2a; border-radius: 14px; font-size: 18px; line-height: 1.45; color: #e6e6e6; transition: border-color .15s; }
  .opt:hover:not(:disabled) { border-color: #555; }
  .opt:disabled { cursor: default; }
  .opt.right { border-color: var(--accent); color: var(--fg); }
  .opt.wrong { border-color: #ff5252; color: #ffb3b3; }
  .opt.dim { opacity: .45; }
  .feedback { margin-top: 22px; font-size: 18px; line-height: 1.6; color: #d6d6d6; min-height: 1.6em; }
  .feedback b { font-weight: 600; }
  .feedback b.ok { color: var(--accent); }
  .feedback b.no { color: #ff5252; }
  .end { text-align: left; }
  .btn { display: inline-block; margin-top: 32px; padding: 14px 24px; border-radius: 999px; background: var(--accent); color: #000; font-weight: 600; font-size: 16px; }
  .btn.ghost { background: none; color: var(--muted); border: 1px solid #2a2a2a; margin-left: 10px; font-weight: 500; }
  .hint { position: fixed; bottom: 18px; left: 0; right: 0; text-align: center; color: var(--faint); font-size: 13px; pointer-events: none; }
  .loading { color: var(--muted); padding: 120px 0; text-align: center; }

  @media (max-width: 640px) {
    .page { padding: 40px 22px 72px; }
    h1 { font-size: 30px; margin-top: 28px; }
    .lead { font-size: 16px; }
    .item-title { font-size: 19px; }
    .chap .name { font-size: 17px; }
    .chap .info { display: none; }
    .bar { padding: 0 18px; height: 54px; gap: 12px; font-size: 13px; }
    .bar .where { max-width: 52vw; }
    .card { padding: 70px 22px 40px; }
    .card h2 { font-size: 27px; margin-bottom: 18px; }
    .card p { font-size: 18px; line-height: 1.6; }
    .eq { font-size: 17px; }
    .note { font-size: 16px; }
    .opt { font-size: 16px; padding: 14px 16px; }
    .feedback { font-size: 16px; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<div id="app"><div class="loading">Loading…</div></div>
<script defer src="app.js"></script>
</body>
</html>
