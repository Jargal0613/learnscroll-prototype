<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LearnScroll — Prototype</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  #feed {
    height: 100vh;
    height: 100dvh;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
  }
  .card {
    height: 100vh;
    height: 100dvh;
    scroll-snap-align: start;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 3.5rem 1.5rem 5rem;
    position: relative;
    background: #0a0a0a;
  }
  .card.understood {
    background: #0d1a12;
  }
  .card-header {
    position: absolute;
    top: 2.8rem;
    left: 1.5rem;
    right: 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85rem;
    color: #aaa;
  }
  .progress {
    font-weight: 600;
    color: #fff;
  }
  .topic {
    background: rgba(255,255,255,0.1);
    padding: 0.25rem 0.6rem;
    border-radius: 999px;
    font-size: 0.75rem;
  }
  .content {
    font-size: 1.35rem;
    line-height: 1.55;
    max-width: 28rem;
    margin: 0 auto;
  }
  .content strong {
    color: #7dd3fc;
  }
  .hint {
    position: absolute;
    bottom: 1.5rem;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.8rem;
    color: #666;
  }
  .actions {
    position: absolute;
    right: 1rem;
    bottom: 6rem;
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
    align-items: center;
  }
  .action-btn {
    background: rgba(255,255,255,0.1);
    border: none;
    color: #fff;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    font-size: 1.3rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, transform 0.1s;
  }
  .action-btn:active { transform: scale(0.94); }
  .action-btn.saved { background: #fbbf24; color: #000; }
  .action-btn.done { background: #22c55e; color: #000; }
  .title-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: 0.8rem 1rem;
    text-align: center;
    font-weight: 600;
    font-size: 0.95rem;
    background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
    pointer-events: none;
    z-index: 10;
  }
  .progress-bar {
    position: absolute;
    top: 0;
    left: 0;
    height: 3px;
    background: #7dd3fc;
    width: 0%;
    transition: width 0.3s ease;
    z-index: 20;
  }
  .resume-banner {
    position: fixed;
    top: 3.2rem;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(125, 211, 252, 0.15);
    border: 1px solid rgba(125, 211, 252, 0.3);
    color: #7dd3fc;
    padding: 0.4rem 0.9rem;
    border-radius: 999px;
    font-size: 0.8rem;
    z-index: 30;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .resume-banner.show { opacity: 1; }
</style>
</head>
<body>
<div class="progress-bar" id="progressBar"></div>
<div class="title-bar">LearnScroll — Photosynthesis (sample)</div>
<div class="resume-banner" id="resumeBanner">Resumed where you left off</div>
<div id="feed"></div>

<script>
const cards = [
  { text: "Welcome to your lesson on <strong>Photosynthesis</strong>. We'll go through it one small piece at a time. Scroll down whenever you're ready for the next explanation." },
  { text: "Photosynthesis is how plants, algae, and some bacteria convert <strong>light energy</strong> into chemical energy that they can use as food." },
  { text: "The overall equation is simple:<br><br>6CO₂ + 6H₂O + light energy → C₆H₁₂O₆ + 6O₂<br><br>Carbon dioxide + water + light → sugar + oxygen." },
  { text: "This process happens mainly in the <strong>chloroplasts</strong> of plant cells. Chloroplasts contain a green pigment called chlorophyll that captures sunlight." },
  { text: "There are two main stages:<br><br>1. Light-dependent reactions<br>2. Light-independent reactions (Calvin cycle)" },
  { text: "<strong>Light-dependent reactions</strong> occur in the thylakoid membranes. They use sunlight to split water, release oxygen, and produce energy carriers (ATP and NADPH)." },
  { text: "The <strong>Calvin cycle</strong> happens in the stroma. It uses the ATP and NADPH to fix carbon dioxide into sugar (glucose). No light is directly required for this stage." },
  { text: "Why does this matter? Almost all life on Earth depends on photosynthesis — either directly (plants) or indirectly (animals that eat plants)." },
  { text: "Quick check: What gas do plants release during photosynthesis?<br><br><strong>Answer:</strong> Oxygen (O₂)." },
  { text: "You just finished the first short sequence on photosynthesis. In a full version of the app, the next cards would continue with more detail, examples, or the next section of your uploaded material." }
];

const feed = document.getElementById('feed');
const progressBar = document.getElementById('progressBar');
const resumeBanner = document.getElementById('resumeBanner');

const STORAGE_KEY = 'learnscroll-progress';
let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
state.understood = state.understood || {};
state.saved = state.saved || {};
state.lastIndex = state.lastIndex || 0;

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function updateProgress(index) {
  const pct = ((index + 1) / cards.length) * 100;
  progressBar.style.width = pct + '%';
  state.lastIndex = index;
  saveState();
}

cards.forEach((card, i) => {
  const el = document.createElement('div');
  el.className = 'card' + (state.understood[i] ? ' understood' : '');
  el.dataset.index = i;
  el.innerHTML = `
    <div class="card-header">
      <span class="progress">${i + 1} / ${cards.length}</span>
      <span class="topic">Science · Lesson 1</span>
    </div>
    <div class="content">${card.text}</div>
    <div class="hint">Scroll down for next card ↓</div>
    <div class="actions">
      <button class="action-btn ${state.saved[i] ? 'saved' : ''}" title="Save" data-action="save">★</button>
      <button class="action-btn ${state.understood[i] ? 'done' : ''}" title="Got it" data-action="done">✓</button>
    </div>
  `;
  feed.appendChild(el);
});

// Hide hint on last card
const hints = document.querySelectorAll('.hint');
if (hints.length) hints[hints.length - 1].style.display = 'none';

// Restore scroll position
if (state.lastIndex > 0) {
  const target = feed.children[state.lastIndex];
  if (target) {
    setTimeout(() => {
      target.scrollIntoView({ behavior: 'instant' });
      updateProgress(state.lastIndex);
      resumeBanner.classList.add('show');
      setTimeout(() => resumeBanner.classList.remove('show'), 2200);
    }, 50);
  }
} else {
  updateProgress(0);
}

// Track current card on scroll
let scrollTimeout;
feed.addEventListener('scroll', () => {
  clearTimeout(scrollTimeout);
  scrollTimeout = setTimeout(() => {
    const index = Math.round(feed.scrollTop / feed.clientHeight);
    if (index >= 0 && index < cards.length) updateProgress(index);
  }, 100);
});

// Button actions
feed.addEventListener('click', (e) => {
  const btn = e.target.closest('.action-btn');
  if (!btn) return;
  const card = btn.closest('.card');
  const index = Number(card.dataset.index);
  const action = btn.dataset.action;

  if (action === 'done') {
    state.understood[index] = !state.understood[index];
    card.classList.toggle('understood', state.understood[index]);
    btn.classList.toggle('done', state.understood[index]);
  } else if (action === 'save') {
    state.saved[index] = !state.saved[index];
    btn.classList.toggle('saved', state.saved[index]);
  }
  saveState();
});

// Keyboard navigation
document.addEventListener('keydown', (e) => {
  const current = Math.round(feed.scrollTop / feed.clientHeight);
  if (e.key === 'ArrowDown' || e.key === ' ') {
    e.preventDefault();
    const next = Math.min(current + 1, cards.length - 1);
    feed.children[next]?.scrollIntoView({ behavior: 'smooth' });
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    const prev = Math.max(current - 1, 0);
    feed.children[prev]?.scrollIntoView({ behavior: 'smooth' });
  }
});
</script>
</body>
</html>
