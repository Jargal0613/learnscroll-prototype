<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LearnScroll</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #111;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  #feed {
    height: 100vh;
    height: 100dvh;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
    padding-top: 4.2rem;
    padding-right: 5.5rem;
  }
  .card {
    height: calc(100vh - 4.2rem);
    height: calc(100dvh - 4.2rem);
    scroll-snap-align: start;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem 1.5rem 2rem;
    background: #111;
  }
  .card-inner {
    width: 100%;
    max-width: 680px;
    background: #0a0a0a;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.08);
    padding: 2.2rem 2rem 1.8rem;
    position: relative;
    min-height: 340px;
    max-height: 78vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
  }
  .card.understood .card-inner {
    background: #0d1a12;
    border-color: rgba(34,197,94,0.25);
  }
  .type-badge {
    position: absolute;
    top: 1rem;
    left: 1.2rem;
    padding: 0.28rem 0.7rem;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 600;
  }
  .type-badge.post { background: rgba(251,191,36,0.15); color: #fbbf24; }
  .type-badge.article { background: rgba(167,139,250,0.18); color: #c4b5fd; }
  .topic-tag {
    position: absolute;
    top: 1rem;
    right: 1.2rem;
    font-size: 0.72rem;
    color: #7dd3fc;
    background: rgba(125,211,252,0.1);
    padding: 0.25rem 0.6rem;
    border-radius: 999px;
  }
  .meta {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    font-size: 0.88rem;
    color: #bbb;
    margin-bottom: 0.7rem;
    margin-top: 1.6rem;
  }
  .avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, #7dd3fc, #a78bfa);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    font-weight: 700;
  }
  .content {
    font-size: 1.15rem;
    line-height: 1.6;
    margin-bottom: 1rem;
  }
  .card.article .content {
    font-size: 1.02rem;
    line-height: 1.68;
  }
  .content strong { color: #fff; }
  .actions {
    position: absolute;
    right: 1rem;
    bottom: 1rem;
    display: flex;
    gap: 0.45rem;
  }
  .action-btn {
    background: rgba(255,255,255,0.08);
    border: none;
    color: #fff;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    font-size: 1.05rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .action-btn:hover { background: rgba(255,255,255,0.16); }
  .action-btn.saved { background: #fbbf24; color: #000; }
  .action-btn.done { background: #22c55e; color: #000; }
  .progress-bar {
    position: fixed;
    top: 0; left: 0;
    height: 3px;
    background: #7dd3fc;
    width: 0%;
    z-index: 100;
    transition: width 0.25s ease;
  }
  .top-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 4.2rem;
    padding: 0.5rem 1.4rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 0.4rem;
    background: #111;
    z-index: 50;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .logo { font-weight: 700; font-size: 1.1rem; }
  .counter { font-size: 0.82rem; color: #aaa; }
  .topic-row {
    display: flex;
    gap: 0.4rem;
    justify-content: center;
    flex-wrap: wrap;
  }
  .topic-btn {
    background: rgba(255,255,255,0.06);
    border: none;
    color: #ccc;
    padding: 0.3rem 0.7rem;
    border-radius: 999px;
    font-size: 0.75rem;
    cursor: pointer;
    font-weight: 500;
  }
  .topic-btn.active {
    background: #fff;
    color: #000;
  }
  .topic-btn:hover:not(.active) {
    background: rgba(255,255,255,0.12);
  }
  /* Vertical type filters on the right */
  .type-sidebar {
    position: fixed;
    right: 0.8rem;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    z-index: 40;
  }
  .filter-btn {
    background: rgba(255,255,255,0.08);
    border: none;
    color: #ccc;
    padding: 0.7rem 0.45rem;
    border-radius: 12px;
    font-size: 0.72rem;
    cursor: pointer;
    font-weight: 600;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    letter-spacing: 0.5px;
    min-height: 5.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .filter-btn.active {
    background: #fff;
    color: #000;
  }
  .filter-btn:hover:not(.active) {
    background: rgba(255,255,255,0.16);
  }
</style>
</head>
<body>
<div class="progress-bar" id="progressBar"></div>
<div class="top-bar">
  <div class="top-row">
    <div class="logo">LearnScroll</div>
    <div class="counter" id="counter">1 / 0</div>
  </div>
  <div class="topic-row" id="topicFilters">
    <button class="topic-btn active" data-topic="all">All topics</button>
    <button class="topic-btn" data-topic="physics">Physics</button>
    <button class="topic-btn" data-topic="thermodynamics">Thermodynamics</button>
    <button class="topic-btn" data-topic="fluidmechanics">Fluid Mechanics</button>
    <button class="topic-btn" data-topic="chemistry">Chemistry</button>
    <button class="topic-btn" data-topic="biology">Biology</button>
    <button class="topic-btn" data-topic="calculus">Calculus</button>
  </div>
</div>
<div class="type-sidebar" id="typeFilters">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="post">Posts</button>
  <button class="filter-btn" data-filter="article">Articles</button>
</div>
<div id="feed"></div>

<script>
const allItems = [
  { type: "post", topic: "biology", text: "<strong>Why short-form learning works for biology</strong><br><br>Breaking processes like photosynthesis into smaller pieces reduces overwhelm. You meet one idea at a time — light reactions, then the Calvin cycle — instead of facing the whole pathway at once. Each piece feels finishable, so you keep going." },
  { type: "post", topic: "physics", text: "<strong>Energy is never created or destroyed</strong><br><br>This is the first law of thermodynamics. In every physical process the total energy of an isolated system stays constant. Energy only changes form — from kinetic to potential, from chemical to thermal, from light to chemical bonds." },
  { type: "article", topic: "biology", text: "<strong>Photosynthesis and cellular respiration in depth</strong><br><br>These two processes form the core energy cycle of life. Photosynthesis captures light energy and stores it in glucose. Cellular respiration releases that stored energy as ATP so cells can do work.<br><br>In photosynthesis, chlorophyll absorbs photons and uses the energy to split water and fix carbon dioxide. Light-dependent reactions occur in the thylakoid membranes; the Calvin cycle occurs in the stroma. Oxygen is released as a byproduct.<br><br>Cellular respiration reverses the flow. Glycolysis in the cytoplasm is followed by the Krebs cycle and electron transport chain in mitochondria. The continuous exchange of carbon dioxide, water, and oxygen between these pathways keeps ecosystems in balance.<br><br>Understanding both mechanisms together shows why protecting plant life protects the foundation of almost every food web." },
  { type: "post", topic: "thermodynamics", text: "<strong>Entropy always increases</strong><br><br>The second law of thermodynamics states that the entropy of an isolated system never decreases. In practical terms, useful energy tends to spread out and become less concentrated over time. This is why perpetual motion machines are impossible." },
  { type: "post", topic: "chemistry", text: "<strong>Chemical reactions rearrange atoms</strong><br><br>Atoms are not created or destroyed in ordinary chemical reactions — they are only rearranged. This is why we balance equations. The number of each type of atom on the reactant side must equal the number on the product side." },
  { type: "article", topic: "thermodynamics", text: "<strong>The laws of thermodynamics and why they matter</strong><br><br>Thermodynamics describes how energy moves and transforms. The first law is conservation of energy: the total energy of an isolated system is constant. Energy can change form but cannot appear from nothing or vanish.<br><br>The second law introduces entropy. In any real process some energy becomes unavailable for useful work. Heat flows spontaneously from hot to cold, never the reverse without external work. This directionality gives time an arrow in physical systems.<br><br>The third law states that the entropy of a perfect crystal approaches zero as temperature approaches absolute zero. While absolute zero is unreachable in practice, the law sets a fundamental reference point.<br><br>These laws constrain every engine, refrigerator, chemical reaction, and biological process. No technology can violate them. Understanding them lets you predict which processes are possible and which are not, regardless of how clever the design." },
  { type: "post", topic: "fluidmechanics", text: "<strong>Pressure in a fluid acts in all directions</strong><br><br>Unlike solids, fluids cannot sustain shear stress when at rest. Pressure at a point in a fluid is the same in every direction. This is why hydraulic systems can transmit force so effectively through pipes." },
  { type: "post", topic: "calculus", text: "<strong>Derivatives measure instantaneous rate of change</strong><br><br>The derivative of a function at a point is the slope of the tangent line at that point. It tells you how fast the output is changing with respect to the input at that exact moment — speed if the function is position, acceleration if the function is velocity." },
  { type: "post", topic: "physics", text: "<strong>Newton’s second law</strong><br><br>Force equals mass times acceleration (F = ma). The greater the force applied to an object, the greater its acceleration. The greater the mass, the smaller the acceleration for the same force." },
  { type: "article", topic: "fluidmechanics", text: "<strong>Core ideas in fluid mechanics</strong><br><br>Fluid mechanics studies how liquids and gases behave when they are at rest (fluid statics) and when they are moving (fluid dynamics). The key difference from solid mechanics is that fluids continuously deform under shear stress.<br><br>Pascal’s principle states that pressure applied to an enclosed fluid is transmitted undiminished to every part of the fluid. This is the foundation of hydraulic lifts and brakes. Archimedes’ principle explains buoyancy: the upward force on a submerged object equals the weight of the fluid displaced.<br><br>When fluids move, Bernoulli’s principle becomes important. Along a streamline, an increase in speed is accompanied by a decrease in pressure (for incompressible, inviscid flow). This relationship explains lift on airplane wings and the operation of many flow-measurement devices.<br><br>Real fluids also have viscosity — internal friction that resists flow. Viscosity determines whether flow is laminar (smooth layers) or turbulent (chaotic). The Reynolds number is the dimensionless quantity used to predict which regime will occur.<br><br>These principles appear everywhere: blood flow in vessels, air over vehicles, water in pipes, weather systems, and industrial processes. Mastering the basic relations lets you analyze a wide range of practical problems." },
  { type: "post", topic: "chemistry", text: "<strong>Acids donate protons, bases accept them</strong><br><br>In the Brønsted–Lowry definition, an acid is a proton (H⁺) donor and a base is a proton acceptor. This simple idea explains a huge range of reactions in water and in biological systems." },
  { type: "post", topic: "calculus", text: "<strong>Integrals accumulate change</strong><br><br>While derivatives tell you the rate, integrals add up all the small changes to give a total. The area under a velocity-time graph is displacement. The area under a force-distance graph is work." },
  { type: "article", topic: "calculus", text: "<strong>Why calculus is the language of change</strong><br><br>Calculus was developed to describe systems that are continuously changing. The two central ideas are the derivative and the integral, and they are inverses of each other (the fundamental theorem of calculus).<br><br>The derivative answers “how fast?” at a single instant. If you know position as a function of time, the derivative is velocity; the derivative of velocity is acceleration. In any science, whenever a quantity depends on another, the derivative gives the sensitivity of that relationship.<br><br>The integral answers “how much in total?” It sums infinitely many infinitesimal contributions. This is why it appears in calculations of work, area, volume, probability, and accumulated growth.<br><br>Together these tools let you move from a local description (what is happening right now) to a global one (what has happened overall), and vice versa. Physics, engineering, economics, biology, and machine learning all rely on this ability. Once the basic rules of differentiation and integration become automatic, a large class of real-world problems becomes approachable." },
  { type: "post", topic: "biology", text: "<strong>Cells are the basic unit of life</strong><br><br>Every living organism is made of one or more cells. Cells carry out all the functions of life: taking in nutrients, producing energy, responding to the environment, and reproducing." },
  { type: "post", topic: "thermodynamics", text: "<strong>Heat engines convert thermal energy into work</strong><br><br>No heat engine can be 100% efficient. The maximum possible efficiency is set by the Carnot limit, which depends only on the temperatures of the hot and cold reservoirs." }
];

const feed = document.getElementById('feed');
const progressBar = document.getElementById('progressBar');
const counter = document.getElementById('counter');
const typeBtns = document.querySelectorAll('.filter-btn');
const topicBtns = document.querySelectorAll('.topic-btn');

let currentType = 'all';
let currentTopic = 'all';
let visibleItems = [...allItems];

const STORAGE_KEY = 'learnscroll-topics-v1';
let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
state.understood = state.understood || {};
state.saved = state.saved || {};

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function updateProgress(index) {
  const pct = visibleItems.length ? ((index + 1) / visibleItems.length) * 100 : 0;
  progressBar.style.width = pct + '%';
  counter.textContent = visibleItems.length ? `${index + 1} / ${visibleItems.length}` : '0 / 0';
  saveState();
}

function render() {
  feed.innerHTML = '';
  visibleItems = allItems.filter(item => {
    const typeOk = currentType === 'all' || item.type === currentType;
    const topicOk = currentTopic === 'all' || item.topic === currentTopic;
    return typeOk && topicOk;
  });

  if (visibleItems.length === 0) {
    feed.innerHTML = '<div class="card"><div class="card-inner"><div class="content">No content for this combination yet.</div></div></div>';
    updateProgress(0);
    return;
  }

  visibleItems.forEach((item) => {
    const originalIndex = allItems.indexOf(item);
    const el = document.createElement('div');
    el.className = `card ${item.type}` + (state.understood[originalIndex] ? ' understood' : '');
    el.dataset.index = originalIndex;
    const badgeText = item.type === 'post' ? 'Post' : 'Article';
    const topicLabel = item.topic.charAt(0).toUpperCase() + item.topic.slice(1);
    el.innerHTML = `
      <div class="card-inner">
        <div class="type-badge ${item.type}">${badgeText}</div>
        <div class="topic-tag">${topicLabel}</div>
        <div class="meta">
          <div class="avatar">LS</div>
          <div>learnscroll</div>
        </div>
        <div class="content">${item.text}</div>
        <div class="actions">
          <button class="action-btn ${state.saved[originalIndex] ? 'saved' : ''}" data-action="save">★</button>
          <button class="action-btn ${state.understood[originalIndex] ? 'done' : ''}" data-action="done">✓</button>
        </div>
      </div>
    `;
    feed.appendChild(el);
  });

  updateProgress(0);
  feed.scrollTop = 0;
}

typeBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    typeBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentType = btn.dataset.filter;
    render();
  });
});

topicBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    topicBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTopic = btn.dataset.topic;
    render();
  });
});

render();

let scrollTimeout;
feed.addEventListener('scroll', () => {
  clearTimeout(scrollTimeout);
  scrollTimeout = setTimeout(() => {
    const index = Math.round(feed.scrollTop / (feed.clientHeight || 1));
    if (index >= 0 && index < visibleItems.length) updateProgress(index);
  }, 60);
});

feed.addEventListener('click', (e) => {
  const btn = e.target.closest('.action-btn');
  if (!btn) return;
  const card = btn.closest('.card');
  const originalIndex = Number(card.dataset.index);
  const action = btn.dataset.action;

  if (action === 'done') {
    state.understood[originalIndex] = !state.understood[originalIndex];
    card.classList.toggle('understood', state.understood[originalIndex]);
    btn.classList.toggle('done', state.understood[originalIndex]);
  } else if (action === 'save') {
    state.saved[originalIndex] = !state.saved[originalIndex];
    btn.classList.toggle('saved', state.saved[originalIndex]);
  }
  saveState();
});

document.addEventListener('keydown', (e) => {
  const current = Math.round(feed.scrollTop / (feed.clientHeight || 1));
  if (e.key === 'ArrowDown' || e.key === ' ') {
    e.preventDefault();
    const next = Math.min(current + 1, visibleItems.length - 1);
    feed.children[next]?.scrollIntoView({ behavior: 'smooth' });
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    const prev = Math.max(current - 1, 0);
    feed.children[prev]?.scrollIntoView({ behavior: 'smooth' });
  }
});
</script>
</body>
</html>
