<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LearnScroll</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #111;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  #feed {
    height: 100vh;
    height: 100dvh;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
  }
  .card {
    height: 100vh;
    height: 100dvh;
    scroll-snap-align: start;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    background: #111;
  }
  .card-inner {
    width: 100%;
    max-width: 720px;
    background: #0a0a0a;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.08);
    padding: 2.4rem 2.2rem 2rem;
    position: relative;
    min-height: 360px;
    max-height: 88vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
  }
  .card.understood .card-inner {
    background: #0d1a12;
    border-color: rgba(34,197,94,0.25);
  }
  .type-badge {
    position: absolute;
    top: 1.1rem;
    left: 1.3rem;
    padding: 0.3rem 0.75rem;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
  }
  .type-badge.post { background: rgba(251,191,36,0.15); color: #fbbf24; }
  .type-badge.article { background: rgba(167,139,250,0.18); color: #c4b5fd; }
  .meta {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    font-size: 0.9rem;
    color: #bbb;
    margin-bottom: 0.8rem;
    margin-top: 1.8rem;
  }
  .avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: linear-gradient(135deg, #7dd3fc, #a78bfa);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.72rem;
    font-weight: 700;
  }
  .content {
    font-size: 1.2rem;
    line-height: 1.6;
    margin-bottom: 1.2rem;
  }
  .card.article .content {
    font-size: 1.05rem;
    line-height: 1.7;
  }
  .content strong { color: #fff; }
  .actions {
    position: absolute;
    right: 1.1rem;
    bottom: 1.2rem;
    display: flex;
    gap: 0.5rem;
  }
  .action-btn {
    background: rgba(255,255,255,0.08);
    border: none;
    color: #fff;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .action-btn:hover { background: rgba(255,255,255,0.16); }
  .action-btn.saved { background: #fbbf24; color: #000; }
  .action-btn.done { background: #22c55e; color: #000; }
  .progress-bar {
    position: fixed;
    top: 0; left: 0;
    height: 3px;
    background: #7dd3fc;
    width: 0%;
    z-index: 100;
    transition: width 0.25s ease;
  }
  .top-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 0.9rem 1.4rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(to bottom, rgba(17,17,17,0.9), transparent);
    z-index: 50;
    pointer-events: none;
  }
  .logo { font-weight: 700; font-size: 1.1rem; }
  .counter { font-size: 0.85rem; color: #aaa; }
  .filters {
    position: fixed;
    top: 3.2rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 0.5rem;
    z-index: 60;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(8px);
    padding: 0.4rem;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .filter-btn {
    background: transparent;
    border: none;
    color: #ccc;
    padding: 0.4rem 0.9rem;
    border-radius: 999px;
    font-size: 0.82rem;
    cursor: pointer;
    font-weight: 500;
  }
  .filter-btn.active {
    background: #fff;
    color: #000;
  }
  .filter-btn:hover:not(.active) { background: rgba(255,255,255,0.08); }
</style>
</head>
<body>
<div class="progress-bar" id="progressBar"></div>
<div class="top-bar">
  <div class="logo">LearnScroll</div>
  <div class="counter" id="counter">1 / 0</div>
</div>
<div class="filters" id="filters">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="post">Posts</button>
  <button class="filter-btn" data-filter="article">Articles</button>
</div>
<div id="feed"></div>

<script>
const allItems = [
  { type: "post", text: "<strong>Why short-form learning works</strong><br><br>Breaking big topics into smaller scrollable pieces reduces overwhelm and makes it easier to stay consistent. Instead of facing one giant block of text, you meet one idea at a time. Each piece feels finishable, so you keep going instead of abandoning the material halfway through.<br><br>This approach does not make the content simpler. It only changes the packaging so your attention can keep up." },
  { type: "post", text: "<strong>The problem with traditional long reads</strong><br><br>Most people start an article, get distracted, and never return. The brain treats a long unbroken page as a single large task, and large tasks trigger resistance.<br><br>When the same information is split into clearly bounded segments, that resistance drops. You finish one card, feel a small sense of progress, and naturally continue to the next." },
  { type: "article", text: "<strong>Energy in living systems: a long-form look</strong><br><br>Photosynthesis and cellular respiration are two sides of the same fundamental process. One captures energy from sunlight and stores it in chemical bonds. The other releases that stored energy so cells can perform work. Together they form the core energy cycle that supports nearly all life on Earth.<br><br>In photosynthesis, chlorophyll inside chloroplasts absorbs photons. That captured light energy is used to split water molecules and to fix carbon dioxide into glucose. The process is not a single reaction. It consists of light-dependent reactions that occur in the thylakoid membranes and light-independent reactions (the Calvin cycle) that take place in the stroma. Oxygen is released as a byproduct — the same gas most animals require for survival.<br><br>Cellular respiration reverses the flow. Glucose is broken down, first through glycolysis in the cytoplasm and later through the Krebs cycle and electron transport chain inside mitochondria. The energy released is captured in ATP, the universal energy currency of the cell. Without continuous production of ATP, complex multicellular life could not exist.<br><br>Viewed together, these two processes explain why ecosystems stay in balance. Plants convert solar energy into chemical energy. Animals and other organisms consume that chemical energy and release carbon dioxide and water, which plants can use again. The cycle is continuous and self-reinforcing.<br><br>Understanding both mechanisms in detail also clarifies why protecting plant life is ultimately protecting the foundation of almost every food web. Disruptions at the level of photosynthesis (through deforestation, ocean acidification, or climate stress) eventually propagate through the entire energy economy of the planet.<br><br>This longer form lets you sit with the connections rather than only the isolated facts. The short cards give you momentum; the article gives you the larger picture." },
  { type: "post", text: "<strong>Attention is the real bottleneck</strong><br><br>You rarely need more information. What you need is a way to consume the information you already care about without losing the thread.<br><br>A vertical feed with clear boundaries helps because it matches how attention actually works: short focused bursts followed by small moments of completion. Over time those small completions add up to real understanding." },
  { type: "post", text: "<strong>Spaced repetition in practice</strong><br><br>Seeing the same idea again after a delay strengthens memory far more than reviewing everything in one sitting. The delay forces your brain to retrieve the information instead of simply recognizing it.<br><br>In a scrolling feed this can happen naturally. Cards you have already seen can reappear later at a lower frequency, turning passive scrolling into active recall without requiring a separate study session." },
  { type: "article", text: "<strong>How packaging changes what you finish</strong><br><br>The internet contains thousands of high-quality long articles that almost no one completes. The writing is often excellent. The problem is structural. A single continuous block of text signals to the brain that the task is large and open-ended. Open-ended tasks are easy to postpone.<br><br>When the identical material is divided into smaller, clearly finished units, the psychological cost of starting drops. Each unit has a visible end. Reaching that end produces a small reward. Those small rewards accumulate and keep you moving.<br><br>This is why a sequence of medium-length posts can outperform a traditional article layout for many learners even when the underlying information is the same. Nothing about the ideas has been simplified. Only the container has changed.<br><br>Extremely long articles still have an important role. They are the right format when you need sustained argument, detailed evidence, historical context, or tightly connected reasoning that would lose force if broken apart. The ideal reading system therefore supports both: medium posts for steady progress and very long articles for depth, with the ability to move between them without losing your place.<br><br>Designing for both lengths also changes how creators work. A writer can publish a core idea as a post and later expand the same idea into a full article. Readers can choose the depth they want on any given day. The system becomes flexible instead of forcing every piece of content into one rigid format.<br><br>Over weeks and months the difference compounds. Readers who finish more of what they start retain more. Creators who offer multiple lengths reach more people. The only requirement is that the packaging respects the limits of attention while still allowing room for genuine depth when it is needed." },
  { type: "post", text: "<strong>Micro-learning versus traditional study sessions</strong><br><br>Traditional study often means setting aside a long block of time. That works when you have the block. It fails when life gets busy.<br><br>Micro-learning means frequent, shorter exposures. You open the feed for a few minutes, move through several cards, and stop. Because each exposure is small, it is easier to return the next day. Consistency usually beats intensity for long-term retention." },
  { type: "post", text: "<strong>On uploading your own material</strong><br><br>In a full version of this app you would drop a PDF, a set of notes, or a book chapter and the system would turn it into a sequence of posts and, where appropriate, longer articles.<br><br>The goal is not to replace careful reading. It is to lower the barrier so you actually start, then give you a path to go deeper when you want to." }
];

const feed = document.getElementById('feed');
const progressBar = document.getElementById('progressBar');
const counter = document.getElementById('counter');
const filterBtns = document.querySelectorAll('.filter-btn');

let currentFilter = 'all';
let visibleItems = [...allItems];

const STORAGE_KEY = 'learnscroll-mixed-v3';
let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
state.understood = state.understood || {};
state.saved = state.saved || {};

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function updateProgress(index) {
  const pct = visibleItems.length ? ((index + 1) / visibleItems.length) * 100 : 0;
  progressBar.style.width = pct + '%';
  counter.textContent = visibleItems.length ? `${index + 1} / ${visibleItems.length}` : '0 / 0';
  saveState();
}

function render() {
  feed.innerHTML = '';
  visibleItems = currentFilter === 'all'
    ? allItems
    : allItems.filter(item => item.type === currentFilter);

  visibleItems.forEach((item) => {
    const originalIndex = allItems.indexOf(item);
    const el = document.createElement('div');
    el.className = `card ${item.type}` + (state.understood[originalIndex] ? ' understood' : '');
    el.dataset.index = originalIndex;
    const badgeText = item.type === 'post' ? 'Post' : 'Article';
    el.innerHTML = `
      <div class="card-inner">
        <div class="type-badge ${item.type}">${badgeText}</div>
        <div class="meta">
          <div class="avatar">LS</div>
          <div>learnscroll</div>
        </div>
        <div class="content">${item.text}</div>
        <div class="actions">
          <button class="action-btn ${state.saved[originalIndex] ? 'saved' : ''}" data-action="save">★</button>
          <button class="action-btn ${state.understood[originalIndex] ? 'done' : ''}" data-action="done">✓</button>
        </div>
      </div>
    `;
    feed.appendChild(el);
  });

  updateProgress(0);
  feed.scrollTop = 0;
}

filterBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    filterBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    render();
  });
});

render();

let scrollTimeout;
feed.addEventListener('scroll', () => {
  clearTimeout(scrollTimeout);
  scrollTimeout = setTimeout(() => {
    const index = Math.round(feed.scrollTop / feed.clientHeight);
    if (index >= 0 && index < visibleItems.length) updateProgress(index);
  }, 60);
});

feed.addEventListener('click', (e) => {
  const btn = e.target.closest('.action-btn');
  if (!btn) return;
  const card = btn.closest('.card');
  const originalIndex = Number(card.dataset.index);
  const action = btn.dataset.action;

  if (action === 'done') {
    state.understood[originalIndex] = !state.understood[originalIndex];
    card.classList.toggle('understood', state.understood[originalIndex]);
    btn.classList.toggle('done', state.understood[originalIndex]);
  } else if (action === 'save') {
    state.saved[originalIndex] = !state.saved[originalIndex];
    btn.classList.toggle('saved', state.saved[originalIndex]);
  }
  saveState();
});

document.addEventListener('keydown', (e) => {
  const current = Math.round(feed.scrollTop / feed.clientHeight);
  if (e.key === 'ArrowDown' || e.key === ' ') {
    e.preventDefault();
    const next = Math.min(current + 1, visibleItems.length - 1);
    feed.children[next]?.scrollIntoView({ behavior: 'smooth' });
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    const prev = Math.max(current - 1, 0);
    feed.children[prev]?.scrollIntoView({ behavior: 'smooth' });
  }
});
</script>
</body>
</html>
