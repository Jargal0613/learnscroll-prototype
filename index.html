<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LearnScroll</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #111;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  #feed {
    height: 100vh;
    height: 100dvh;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
  }
  .card {
    height: 100vh;
    height: 100dvh;
    scroll-snap-align: start;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    background: #111;
  }
  .card-inner {
    width: 100%;
    max-width: 640px;
    background: #0a0a0a;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.08);
    padding: 2.5rem 2.2rem 2rem;
    position: relative;
    min-height: 420px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
  }
  .card.understood .card-inner {
    background: #0d1a12;
    border-color: rgba(34,197,94,0.25);
  }
  .type-badge {
    position: absolute;
    top: 1.2rem;
    left: 1.4rem;
    padding: 0.35rem 0.8rem;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 600;
  }
  .type-badge.lesson { background: rgba(125,211,252,0.18); color: #7dd3fc; }
  .type-badge.post { background: rgba(251,191,36,0.15); color: #fbbf24; }
  .meta {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    font-size: 0.9rem;
    color: #bbb;
    margin-bottom: 0.8rem;
  }
  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, #7dd3fc, #a78bfa);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
  }
  .content {
    font-size: 1.55rem;
    line-height: 1.5;
    margin-bottom: 1.2rem;
  }
  .content strong { color: #fff; }
  .actions {
    position: absolute;
    right: 1.2rem;
    bottom: 1.4rem;
    display: flex;
    gap: 0.6rem;
  }
  .action-btn {
    background: rgba(255,255,255,0.08);
    border: none;
    color: #fff;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    font-size: 1.15rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .action-btn:hover { background: rgba(255,255,255,0.16); }
  .action-btn.saved { background: #fbbf24; color: #000; }
  .action-btn.done { background: #22c55e; color: #000; }
  .progress-bar {
    position: fixed;
    top: 0; left: 0;
    height: 3px;
    background: #7dd3fc;
    width: 0%;
    z-index: 100;
    transition: width 0.25s ease;
  }
  .top-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 1rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(to bottom, rgba(17,17,17,0.85), transparent);
    z-index: 50;
    pointer-events: none;
  }
  .logo {
    font-weight: 700;
    font-size: 1.15rem;
  }
  .counter {
    font-size: 0.85rem;
    color: #aaa;
  }
  @media (max-width: 700px) {
    .card-inner {
      max-width: 100%;
      border-radius: 0;
      border: none;
      min-height: 100%;
      padding: 4rem 1.4rem 2rem;
    }
    .card { padding: 0; }
  }
</style>
</head>
<body>
<div class="progress-bar" id="progressBar"></div>
<div class="top-bar">
  <div class="logo">LearnScroll</div>
  <div class="counter" id="counter">1 / 24</div>
</div>
<div id="feed"></div>

<script>
const items = [
  { type: "lesson", text: "Welcome to your lesson on <strong>Photosynthesis</strong>. We'll go through it one small piece at a time. Scroll down whenever you're ready for the next explanation." },
  { type: "post", text: "<strong>Why short-form learning works</strong><br><br>Breaking big topics into tiny scrollable pieces reduces overwhelm and makes it easier to stay consistent." },
  { type: "lesson", text: "Photosynthesis is how plants, algae, and some bacteria convert <strong>light energy</strong> into chemical energy that they can use as food." },
  { type: "post", text: "<strong>The problem with long articles</strong><br><br>Most people start reading, get distracted, and never finish. A vertical feed forces one idea at a time." },
  { type: "lesson", text: "The overall equation is simple:<br><br>6CO₂ + 6H₂O + light energy → C₆H₁₂O₆ + 6O₂<br><br>Carbon dioxide + water + light → sugar + oxygen." },
  { type: "post", text: "<strong>Spaced repetition in your pocket</strong><br><br>Seeing the same idea again later (instead of all at once) helps memory stick far better than cramming." },
  { type: "lesson", text: "This process happens mainly in the <strong>chloroplasts</strong> of plant cells. Chloroplasts contain a green pigment called chlorophyll that captures sunlight." },
  { type: "post", text: "<strong>Attention is the real bottleneck</strong><br><br>You don’t need more information. You need a way to consume the information you already care about without getting lost." },
  { type: "lesson", text: "There are two main stages:<br><br>1. Light-dependent reactions<br>2. Light-independent reactions (Calvin cycle)" },
  { type: "post", text: "<strong>Micro-learning vs. traditional study</strong><br><br>Traditional study often means long sessions. Micro-learning means frequent, short exposures. Both can work — the second is easier to maintain." },
  { type: "lesson", text: "<strong>Light-dependent reactions</strong> occur in the thylakoid membranes. They use sunlight to split water, release oxygen, and produce energy carriers (ATP and NADPH)." },
  { type: "post", text: "<strong>How to use this feed</strong><br><br>Scroll when you have a minute. Mark cards as understood. Come back later and pick up exactly where you left off." },
  { type: "lesson", text: "The <strong>Calvin cycle</strong> happens in the stroma. It uses the ATP and NADPH to fix carbon dioxide into sugar (glucose). No light is directly required for this stage." },
  { type: "post", text: "<strong>On uploading your own material</strong><br><br>In the full version you would drop a PDF, notes, or a book chapter and the app would turn it into a sequence of cards like these." },
  { type: "lesson", text: "Why does this matter? Almost all life on Earth depends on photosynthesis — either directly (plants) or indirectly (animals that eat plants)." },
  { type: "post", text: "<strong>Final thought</strong><br><br>The goal is not to replace deep reading. It’s to make the first steps of learning lighter so you actually start." },
  { type: "lesson", text: "Quick check: What gas do plants release during photosynthesis?<br><br><strong>Answer:</strong> Oxygen (O₂)." },
  { type: "lesson", text: "<strong>Next concept: Cellular Respiration</strong><br><br>While photosynthesis stores energy, cellular respiration releases it so cells can do work." },
  { type: "lesson", text: "The simplified equation for cellular respiration is the reverse of photosynthesis:<br><br>C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + energy (ATP)" },
  { type: "lesson", text: "It happens in three main stages: glycolysis, the Krebs cycle, and the electron transport chain." },
  { type: "lesson", text: "<strong>Glycolysis</strong> takes place in the cytoplasm and breaks glucose into two pyruvate molecules, producing a small amount of ATP." },
  { type: "lesson", text: "Most of the energy is released later in the mitochondria during the Krebs cycle and electron transport chain." },
  { type: "lesson", text: "Together, photosynthesis and cellular respiration form a continuous cycle of energy transformation that powers nearly all life." },
  { type: "lesson", text: "You just finished this sequence. Keep scrolling — more mixed content will appear as the app grows." }
];

const feed = document.getElementById('feed');
const progressBar = document.getElementById('progressBar');
const counter = document.getElementById('counter');

const STORAGE_KEY = 'learnscroll-mixed-v1';
let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
state.understood = state.understood || {};
state.saved = state.saved || {};
state.lastIndex = state.lastIndex || 0;

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function updateProgress(index) {
  const pct = ((index + 1) / items.length) * 100;
  progressBar.style.width = pct + '%';
  counter.textContent = `${index + 1} / ${items.length}`;
  state.lastIndex = index;
  saveState();
}

items.forEach((item, i) => {
  const el = document.createElement('div');
  el.className = 'card' + (state.understood[i] ? ' understood' : '');
  el.dataset.index = i;
  const badgeClass = item.type === 'lesson' ? 'lesson' : 'post';
  const badgeText = item.type === 'lesson' ? 'Lesson' : 'Post';
  el.innerHTML = `
    <div class="card-inner">
      <div class="type-badge ${badgeClass}">${badgeText}</div>
      <div class="meta">
        <div class="avatar">LS</div>
        <div>learnscroll</div>
      </div>
      <div class="content">${item.text}</div>
      <div class="actions">
        <button class="action-btn ${state.saved[i] ? 'saved' : ''}" data-action="save">★</button>
        <button class="action-btn ${state.understood[i] ? 'done' : ''}" data-action="done">✓</button>
      </div>
    </div>
  `;
  feed.appendChild(el);
});

if (state.lastIndex > 0) {
  setTimeout(() => {
    feed.children[state.lastIndex]?.scrollIntoView({ behavior: 'instant' });
    updateProgress(state.lastIndex);
  }, 40);
} else {
  updateProgress(0);
}

let scrollTimeout;
feed.addEventListener('scroll', () => {
  clearTimeout(scrollTimeout);
  scrollTimeout = setTimeout(() => {
    const index = Math.round(feed.scrollTop / feed.clientHeight);
    if (index >= 0 && index < items.length) updateProgress(index);
  }, 60);
});

feed.addEventListener('click', (e) => {
  const btn = e.target.closest('.action-btn');
  if (!btn) return;
  const card = btn.closest('.card');
  const index = Number(card.dataset.index);
  const action = btn.dataset.action;

  if (action === 'done') {
    state.understood[index] = !state.understood[index];
    card.classList.toggle('understood', state.understood[index]);
    btn.classList.toggle('done', state.understood[index]);
  } else if (action === 'save') {
    state.saved[index] = !state.saved[index];
    btn.classList.toggle('saved', state.saved[index]);
  }
  saveState();
});

document.addEventListener('keydown', (e) => {
  const current = Math.round(feed.scrollTop / feed.clientHeight);
  if (e.key === 'ArrowDown' || e.key === ' ') {
    e.preventDefault();
    const next = Math.min(current + 1, items.length - 1);
    feed.children[next]?.scrollIntoView({ behavior: 'smooth' });
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    const prev = Math.max(current - 1, 0);
    feed.children[prev]?.scrollIntoView({ behavior: 'smooth' });
  }
});
</script>
</body>
</html>
