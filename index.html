<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LearnScroll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
  :root {
    --bg: #0a0a0b; --surface: #111113; --surface-2: #17171a; --surface-3: #1e1e22;
    --line: #232327; --line-strong: #2e2e33;
    --fg: #ededed; --fg-2: #c9c9cc; --muted: #8b8b92; --faint: #808088;
    --accent: #00e676; --accent-soft: rgba(0,230,118,0.10); --accent-line: rgba(0,230,118,0.45);
    --danger: #ff6b6b; --focus: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--fg); font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  :focus { outline: none; }
  :focus-visible { box-shadow: var(--focus); border-radius: var(--radius); outline: 2px solid transparent; }
  .keys-dlg { margin: auto; background: var(--surface); color: var(--fg); border: 1px solid var(--line-strong); border-radius: 12px; padding: 22px 26px; width: min(520px, calc(100vw - 32px)); max-height: calc(100vh - 64px); overflow: auto; }
  .keys-dlg::backdrop { background: rgba(0,0,0,.6); }
  .keys-head { display: flex; justify-content: space-between; align-items: center; }
  .keys-head h2 { font-size: 17px; margin: 0; }
  .keys-note { color: var(--muted); font-size: 13px; margin: 6px 0 4px; }
  .keys-dlg h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 6px; }
  .keys-dlg dl { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; margin: 0; font-size: 14px; }
  .keys-dlg dd { margin: 0; color: var(--fg-2); }
  .keys-dlg kbd { font: inherit; font-size: 12px; padding: 1px 6px; border: 1px solid var(--line-strong); border-radius: 4px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Shared page shell */
  .page { max-width: 1200px; margin: 0 auto; padding: 56px 48px 96px; }
  .topline { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { font-size: 15px; font-weight: 600; letter-spacing: 0.01em; color: var(--fg); display: inline-flex; align-items: center; gap: 10px; }
  .brand i { width: 8px; height: 8px; background: var(--accent); border-radius: 2px; display: inline-block; }
  h1 { font-size: 40px; font-weight: 600; letter-spacing: -0.025em; line-height: 1.15; margin: 48px 0 12px; max-width: 900px; }
  .lead { color: var(--muted); font-size: 17px; line-height: 1.6; max-width: 640px; }
  .meta-line { color: var(--muted); font-size: 15px; margin-top: 4px; }
  .notice { margin-top: 24px; padding: 12px 16px; border: 1px solid var(--line-strong); border-left: 2px solid var(--danger); background: var(--surface); color: var(--fg-2); font-size: 14px; border-radius: var(--radius); }
  .continue { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-top: 36px; padding: 18px 22px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius); max-width: 640px; transition: border-color .15s, background .15s; }
  .continue:hover { border-color: var(--accent-line); background: var(--surface-2); }
  .continue .k { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
  .continue .t { font-size: 16px; font-weight: 500; margin-top: 4px; }
  .continue .s { font-size: 14px; color: var(--muted); margin-top: 2px; }
  .continue .go { color: var(--accent); font-weight: 500; font-size: 15px; white-space: nowrap; }
  .section-h { display: flex; align-items: baseline; justify-content: space-between; margin: 56px 0 16px; padding-bottom: 12px; border-bottom: 1px solid var(--line); font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

  /* Library grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; }
  .book { display: flex; flex-direction: column; padding: 24px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); transition: border-color .15s, background .15s; min-height: 280px; }
  .book:hover { border-color: var(--line-strong); background: var(--surface-2); }
  .book:hover .book-title { color: #fff; }
  .book-title { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; color: var(--fg); }
  .book-meta { color: var(--muted); font-size: 14px; margin-top: 6px; line-height: 1.45; }
  .book-desc { color: var(--fg-2); font-size: 15px; line-height: 1.55; margin-top: 14px; flex: 1; }
  .stats { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stats b { color: var(--fg-2); font-weight: 500; }
  .prog { margin-top: 14px; font-size: 13px; color: var(--muted); }
  .prog.on { color: var(--accent); }
  .meter { height: 2px; background: var(--line-strong); margin-top: 8px; border-radius: 2px; overflow: hidden; }
  .meter span { display: block; height: 100%; background: var(--accent); }

  /* Chapter browser */
  .back { color: var(--muted); font-size: 14px; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; margin-left: -10px; border-radius: var(--radius); transition: color .15s, background .15s; }
  .back:hover { color: var(--fg); background: var(--surface-2); }
  .book-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 32px; flex-wrap: wrap; }
  .book-head h1 { margin-top: 32px; }
  .legend { display: flex; gap: 18px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .chapters { border-top: 1px solid var(--line); margin-top: 40px; }
  .chap { display: grid; grid-template-columns: 48px 1fr auto auto; gap: 20px; align-items: center; width: 100%; text-align: left; padding: 16px 12px; border-bottom: 1px solid var(--line); transition: background .15s; }
  a.chap:hover { background: var(--surface); }
  a.chap:hover .name { color: #fff; }
  .chap .num { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 14px; }
  .chap .name { font-size: 17px; line-height: 1.4; color: var(--fg); min-width: 0; overflow-wrap: anywhere; }
  .chap .counts { color: var(--muted); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .pill { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--muted); white-space: nowrap; min-width: 92px; text-align: center; font-variant-numeric: tabular-nums; }
  .pill.done { color: #0a0a0b; background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .pill.prog { color: var(--accent); border-color: var(--accent-line); margin: 0; }
  .pill.ready { color: var(--fg-2); }
  .chap.soon .num, .chap.soon .name { color: var(--faint); }
  .chap.soon .pill { color: var(--faint); border-color: var(--line); border-style: dashed; }

  /* Phase 1: marks, filters, recent */
  .marks { margin-left: auto; display: inline-flex; gap: 6px; text-transform: none; letter-spacing: 0; }
  .mark { font-size: 12px; padding: 3px 10px; border: 1px solid var(--line-strong); border-radius: 999px; color: var(--muted); transition: color .15s, border-color .15s, background .15s; }
  .mark:hover { color: var(--fg); border-color: #4a4a52; }
  .mark[data-mark="b"][aria-pressed="true"] { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }
  .mark[data-mark="d"][aria-pressed="true"] { color: var(--fg); border-color: #8a8a92; background: var(--surface-3); }
  .tabs { display: flex; gap: 4px; margin-top: 32px; border-bottom: 1px solid var(--line); }
  .tabs a { padding: 10px 14px; font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; border-radius: 6px 6px 0 0; }
  .tabs a:hover { color: var(--fg); }
  .tabs a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--accent); }
  .tabs a span { font-size: 12px; color: var(--faint); margin-left: 4px; font-variant-numeric: tabular-nums; }
  .tabs + .chapters { margin-top: 0; border-top: 0; }
  .marked { list-style: none; }
  .marked a { display: grid; grid-template-columns: 64px 1fr auto; gap: 20px; align-items: center; padding: 16px 12px; border-bottom: 1px solid var(--line); }
  .marked a:hover { background: var(--surface); }
  .marked .num { color: var(--muted); font-size: 14px; }
  .marked .name { font-size: 17px; color: var(--fg); }
  .marked .counts { color: var(--muted); font-size: 13px; }
  .marked-empty { padding: 48px 12px; color: var(--muted); font-size: 15px; line-height: 1.7; }
  .marked-empty kbd, .empty-note kbd { font: inherit; font-size: 12px; padding: 1px 6px; border: 1px solid var(--line-strong); border-radius: 4px; }
  .cmeter { display: block; width: 160px; height: 2px; background: var(--line-strong); margin-top: 8px; border-radius: 2px; overflow: hidden; }
  .cmeter i { display: block; height: 100%; background: var(--accent); }
  .recent { list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .recent a { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); transition: border-color .15s, background .15s; }
  .recent a:hover { border-color: var(--line-strong); background: var(--surface-2); }
  .r-book { font-size: 12px; color: var(--muted); }
  .r-ch { font-size: 15px; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .r-pos { font-size: 13px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .att-why { font-size: 13px; color: var(--fg-2); line-height: 1.4; }
  .att-empty { margin-top: 4px; }
  .empty-note { color: var(--muted); font-size: 14px; }

  /* Phase 2: notes + review */
  .mark.has-note { color: var(--fg-2); border-color: var(--line-strong); }
  .mark.has-note::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 6px; vertical-align: 1px; }
  .note-ed { margin-top: 20px; padding: 12px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius); }
  .note-ed textarea { width: 100%; resize: vertical; min-height: 72px; font: inherit; font-size: 15px; line-height: 1.55; color: var(--fg); background: var(--bg); border: 1px solid var(--line-strong); border-radius: 6px; padding: 10px 12px; }
  .note-ed textarea:focus { border-color: var(--accent-line); box-shadow: 0 0 0 1px var(--accent-line); }
  .note-row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 12.5px; }
  .note-status { color: var(--muted); }
  .note-row kbd, .rv-actions kbd { font: inherit; font-size: 11px; padding: 0 5px; border: 1px solid currentColor; border-radius: 4px; opacity: .7; margin-left: 4px; }
  .note-snip { display: block; font-size: 13.5px; color: var(--muted); margin-top: 4px; white-space: pre-wrap; }
  .tabs { align-items: center; }
  .tabs-r { margin-left: auto; padding-bottom: 6px; }
  .btn.sm { padding: 7px 14px; font-size: 13.5px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .review-row { display: flex; flex-wrap: wrap; gap: 10px; }
  .rv-choices { display: grid; grid-template-columns: repeat(3, minmax(0, 260px)); gap: 12px; margin-top: 28px; }
  .rv-choice { display: flex; flex-direction: column; gap: 4px; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
  a.rv-choice:hover { border-color: var(--accent-line); background: var(--surface-2); }
  .rv-choice b { font-weight: 600; font-size: 16px; }
  .rv-choice span { color: var(--muted); font-size: 13.5px; }
  .rv-choice.off { opacity: .45; }
  .review { max-width: 820px; }
  .rv-top { display: flex; justify-content: space-between; align-items: center; }
  .rv-count { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .rv-track { height: 2px; background: var(--line); margin: 14px 0 40px; }
  .rv-track i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .rv-card h2 { font-size: 32px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.25; margin-bottom: 20px; }
  .rv-card p { font-size: 19px; line-height: 1.7; color: var(--fg-2); }
  .rv-card .eq { margin-top: 24px; }
  .rv-last { font-size: 13.5px !important; color: var(--muted) !important; margin-bottom: 16px; }
  .rv-actions { display: flex; align-items: center; gap: 10px; margin-top: 32px; }
  .rv-tip { color: var(--muted); font-size: 13.5px; margin-left: 6px; }
  .rv-opts { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .rv-opts li { display: flex; gap: 12px; padding: 12px 16px; border: 1px solid var(--line-strong); border-radius: var(--radius); color: var(--fg-2); font-size: 16px; }
  .rv-opts li span { color: var(--muted); font-weight: 600; font-size: 13px; }
  .rv-opts li.right { border-color: var(--accent); background: var(--accent-soft); color: var(--fg); }
  .rv-card .feedback { margin-top: 16px; }

  /* Reliability */
  .save-warn { position: fixed; left: 50%; bottom: 72px; transform: translateX(-50%); z-index: 30; max-width: min(720px, 92vw); display: flex; gap: 16px; align-items: center; padding: 12px 16px; background: var(--surface); border: 1px solid var(--danger); border-radius: var(--radius); font-size: 13.5px; color: var(--fg-2); box-shadow: 0 12px 40px rgba(0,0,0,.5); }
  .save-warn[hidden] { display: none; }
  .save-warn .t-link { flex: none; }
  #recover .rec-a { white-space: nowrap; }

  .mist-line { color: var(--fg-2); font-size: 15px; margin-top: 8px; }
  .ok-l { color: var(--muted); font-weight: 600; font-size: 13px; margin-right: 6px; }

  .att-k { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; margin-right: 10px; color: var(--muted); border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 6px; }
  .att-k.k-mistakes, .att-k.k-difficult { color: #ffb4a8; border-color: rgba(255,107,107,.45); }
  .att-k.k-again { color: var(--accent); border-color: var(--accent-line); }

  /* Study session */
  .sess { max-width: 860px; }
  .sess-form { margin-top: 28px; display: flex; flex-direction: column; gap: 18px; }
  .sess-field { display: flex; align-items: center; gap: 16px; }
  .sess-l { width: 64px; color: var(--muted); font-size: 13.5px; }
  .seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line-strong); border-radius: var(--radius); overflow: hidden; }
  .seg button { padding: 8px 14px; font-size: 14px; color: var(--muted); border-right: 1px solid var(--line-strong); }
  .seg button:last-child { border-right: 0; }
  .seg button:hover { color: var(--fg); background: var(--surface-2); }
  .seg button[aria-checked="true"] { color: var(--accent); background: var(--accent-soft); }
  .sess-q { color: var(--fg-2); font-size: 14px; }
  .seg.one { flex-wrap: nowrap; max-width: 100%; }
  .seg[hidden], .sess-sel[hidden] { display: none; }
  .seg.one button { white-space: nowrap; }
  .seg button[aria-checked="true"] { font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); }
  .seg button[aria-checked="true"]::before { content: '✓ '; }
  .sess-sel { max-width: 100%; min-width: 0; height: 38px; padding: 0 12px; font: inherit; font-size: 14px; color: var(--fg); background: var(--surface); border: 1px solid var(--accent-line); border-radius: var(--radius); }
  .sess-field { min-width: 0; }
  .sess + .lead, .sess-sum + .lead { margin-top: 20px; }
  .sess-sum { margin-top: 24px; padding: 18px 20px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); max-width: 420px; }
  .sess-sum h2 { font-size: 16px; font-weight: 600; }
  .sess-sum .imp-counts { margin-top: 10px; }
  .sess-note { margin-top: 8px; font-size: 12.5px; color: var(--faint); }
  .bar .count.left { color: var(--muted); }
  .sess-from { color: var(--faint); }
  .sess-msg { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); z-index: 8; padding: 10px 16px; background: var(--surface); border: 1px solid var(--accent-line); border-radius: var(--radius); font-size: 14px; color: var(--fg-2); }
  .sess-msg .t-link { color: var(--accent); font-size: 14px; }

  /* Tutor: check my understanding */
  .t-check-row { margin-top: 8px; }
  .t-check-btn { font-size: 12.5px; color: var(--accent); }
  .t-check { margin-top: 10px; padding: 10px 12px; border: 1px solid var(--accent-line); border-radius: var(--radius); background: var(--accent-soft); }
  .t-check-h { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
  .t-check-acts { display: flex; gap: 14px; margin-top: 8px; }
  .t-check-acts .t-link { font-size: 12.5px; color: var(--fg-2); text-decoration: underline; text-underline-offset: 3px; }
  .t-check-hint, .t-check-ans { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }

  /* Library search */
  .search { position: relative; width: min(440px, 46vw); }
  .search input { width: 100%; height: 38px; padding: 0 36px 0 14px; font: inherit; font-size: 14px; color: var(--fg); background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius); }
  .search input::-webkit-search-cancel-button { display: none; }
  .search input:focus { border-color: var(--accent-line); outline: none; box-shadow: 0 0 0 1px var(--accent-line); }
  .q-key { position: absolute; right: 10px; top: 9px; font: inherit; font-size: 11px; color: var(--faint); border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 6px; pointer-events: none; }
  .search input:focus ~ .q-key { display: none; }
  .q-res { position: absolute; z-index: 20; top: 44px; right: 0; width: min(620px, 92vw); max-height: min(70vh, 640px); overflow-y: auto; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius); box-shadow: 0 16px 48px rgba(0,0,0,.5); padding: 6px 0; }
  .q-book { padding: 10px 16px 4px; font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  .q-ch { padding: 6px 16px 2px; font-size: 12.5px; color: var(--muted); }
  .q-item { display: flex; gap: 12px; padding: 8px 16px; color: var(--fg-2); }
  .q-item[aria-selected="true"] { background: var(--surface-2); color: var(--fg); box-shadow: inset 2px 0 0 var(--accent); }
  .q-kind { flex: none; width: 58px; font-size: 11px; color: var(--faint); padding-top: 2px; }
  .q-main { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .q-t { font-size: 14px; font-weight: 500; }
  .q-s { font-size: 13px; color: var(--muted); line-height: 1.5; }
  .q-res mark { background: var(--accent-soft); color: var(--accent); border-radius: 2px; padding: 0 1px; }
  .q-empty { padding: 18px 16px; color: var(--muted); font-size: 14px; }
  .q-foot { padding: 8px 16px 4px; border-top: 1px solid var(--line); margin-top: 6px; font-size: 12px; color: var(--faint); }

  /* Export / import */
  .notice.ok { border-left-color: var(--accent); }
  .lib-foot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px; margin-top: 56px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--faint); font-size: 13px; }
  .lib-foot-a { display: flex; align-items: center; gap: 10px; }
  .lib-foot .t-link { font-size: 13px; color: var(--muted); }
  .lib-foot .t-link:hover { color: var(--fg); }
  .exp-conv { display: flex; align-items: center; gap: 5px; color: var(--faint); }
  .imp { max-width: 980px; }
  .imp h2 { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
  .imp-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 28px; }
  .imp-cols section, .imp-opt { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; }
  .imp-counts { list-style: none; font-size: 14px; }
  .imp-counts li { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--line); color: var(--fg-2); }
  .imp-counts li:last-child { border-bottom: 0; }
  .imp-counts b { font-weight: 600; color: var(--fg); font-variant-numeric: tabular-nums; }
