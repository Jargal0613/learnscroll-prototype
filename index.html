<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LearnScroll</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #111;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  #feed {
    height: 100vh;
    height: 100dvh;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
    padding-top: 4.2rem;
    padding-right: 5.5rem;
  }
  .card {
    height: calc(100vh - 4.2rem);
    height: calc(100dvh - 4.2rem);
    scroll-snap-align: start;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem 1.5rem 2rem;
    background: #111;
  }
  .card-inner {
    width: 100%;
    max-width: 680px;
    background: #0a0a0a;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.08);
    padding: 2.2rem 2rem 1.8rem;
    position: relative;
    min-height: 340px;
    max-height: 78vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
  }
  .card.understood .card-inner {
    background: #0d1a12;
    border-color: rgba(34,197,94,0.25);
  }
  .type-badge {
    position: absolute;
    top: 1rem;
    left: 1.2rem;
    padding: 0.28rem 0.7rem;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 600;
  }
  .type-badge.post { background: rgba(251,191,36,0.15); color: #fbbf24; }
  .type-badge.article { background: rgba(167,139,250,0.18); color: #c4b5fd; }
  .topic-tag {
    position: absolute;
    top: 1rem;
    right: 1.2rem;
    font-size: 0.72rem;
    color: #7dd3fc;
    background: rgba(125,211,252,0.1);
    padding: 0.25rem 0.6rem;
    border-radius: 999px;
  }
  .meta {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    font-size: 0.88rem;
    color: #bbb;
    margin-bottom: 0.7rem;
    margin-top: 1.6rem;
  }
  .avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, #7dd3fc, #a78bfa);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    font-weight: 700;
  }
  .source {
    font-size: 0.72rem;
    color: #888;
    margin-left: auto;
  }
  .content {
    font-size: 1.12rem;
    line-height: 1.6;
    margin-bottom: 1rem;
    white-space: pre-wrap;
  }
  .card.article .content {
    font-size: 1.02rem;
    line-height: 1.68;
  }
  .content strong { color: #fff; }
  .actions {
    position: absolute;
    right: 1rem;
    bottom: 1rem;
    display: flex;
    gap: 0.45rem;
  }
  .action-btn {
    background: rgba(255,255,255,0.08);
    border: none;
    color: #fff;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    font-size: 1.05rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .action-btn:hover { background: rgba(255,255,255,0.16); }
  .action-btn.saved { background: #fbbf24; color: #000; }
  .action-btn.done { background: #22c55e; color: #000; }
  .progress-bar {
    position: fixed;
    top: 0; left: 0;
    height: 3px;
    background: #7dd3fc;
    width: 0%;
    z-index: 100;
    transition: width 0.25s ease;
  }
  .top-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 4.2rem;
    padding: 0.5rem 1.4rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 0.4rem;
    background: #111;
    z-index: 50;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .logo { font-weight: 700; font-size: 1.1rem; }
  .counter { font-size: 0.82rem; color: #aaa; }
  .topic-row {
    display: flex;
    gap: 0.4rem;
    justify-content: center;
    flex-wrap: wrap;
  }
  .topic-btn {
    background: rgba(255,255,255,0.06);
    border: none;
    color: #ccc;
    padding: 0.3rem 0.7rem;
    border-radius: 999px;
    font-size: 0.75rem;
    cursor: pointer;
    font-weight: 500;
  }
  .topic-btn.active { background: #fff; color: #000; }
  .topic-btn:hover:not(.active) { background: rgba(255,255,255,0.12); }
  .type-sidebar {
    position: fixed;
    right: 0.8rem;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    z-index: 40;
  }
  .filter-btn {
    background: rgba(255,255,255,0.08);
    border: none;
    color: #ccc;
    padding: 0.7rem 0.45rem;
    border-radius: 12px;
    font-size: 0.72rem;
    cursor: pointer;
    font-weight: 600;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    letter-spacing: 0.5px;
    min-height: 5.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .filter-btn.active { background: #fff; color: #000; }
  .filter-btn:hover:not(.active) { background: rgba(255,255,255,0.16); }
</style>
</head>
<body>
<div class="progress-bar" id="progressBar"></div>
<div class="top-bar">
  <div class="top-row">
    <div class="logo">LearnScroll</div>
    <div class="counter" id="counter">1 / 0</div>
  </div>
  <div class="topic-row" id="topicFilters">
    <button class="topic-btn active" data-topic="all">All topics</button>
    <button class="topic-btn" data-topic="physics">Physics</button>
    <button class="topic-btn" data-topic="thermodynamics">Thermodynamics</button>
    <button class="topic-btn" data-topic="fluidmechanics">Fluid Mechanics</button>
    <button class="topic-btn" data-topic="chemistry">Chemistry</button>
    <button class="topic-btn" data-topic="biology">Biology</button>
    <button class="topic-btn" data-topic="calculus">Calculus</button>
  </div>
</div>
<div class="type-sidebar" id="typeFilters">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="post">Posts</button>
  <button class="filter-btn" data-filter="article">Articles</button>
</div>
<div id="feed"></div>

<script>
const allItems = [
  { type: "post", topic: "calculus", source: "X · @martinmrmar", text: "If you want to practice your limits... here you go! (From Calculus by Louis Leithold 5th edition)." },
  { type: "post", topic: "fluidmechanics", source: "X · @SciencesKL", text: "5 Equations Behind Fluid Mechanics\n#physics" },
  { type: "post", topic: "physics", source: "X · @SciencesKL", text: "The Three Titans of Statistical Mechanics\n#physics" },
  { type: "post", topic: "physics", source: "X · @SciencesKL", text: "The Minds Behind Modern Physics: Werner Heisenberg (1901–1976)\n#physics" },
  { type: "post", topic: "biology", source: "X · @Treasure_Mome", text: "DID YOU KNOW HOW AMAZING TREES ARE?\n\nTrees are among nature’s greatest treasures!\n\nThey absorb carbon dioxide and release oxygen through photosynthesis.\nThey provide homes for birds and many other animals.\nTheir roots help protect soil from erosion.\nTheir shade helps keep our surroundings cooler.\nMany trees provide fruits, medicine, and materials that people use every day.\n\nImagine a world without trees. Our environment would be very different!\n\nPlanting and protecting trees is one way we can help care for our planet." },
  { type: "post", topic: "calculus", source: "X · @Sam_Axiom", text: "What Is a Derivative, Really?  | Calculus Explained Visually\n\nWhat does a derivative actually mean? Why do mathematicians use ? And how can we calculate the exact rate at which something changes at a single point?" },
  { type: "post", topic: "physics", source: "X · @SmartScience", text: "Nobel Prize-winning physicist Roger Penrose has spent decades investigating one of science’s biggest mysteries: whether consciousness can be fully explained by the physical processes occurring inside the brain.\n\nPenrose, who received the 2020 Nobel Prize in Physics for his work on black holes, has proposed that consciousness may involve quantum processes that conventional neuroscience does not yet fully explain.\n\nTogether with anesthesiologist Stuart Hameroff, he developed the Orch-OR theory, which suggests that quantum events inside microscopic structures called microtubules could contribute to conscious experience." },
  { type: "post", topic: "thermodynamics", source: "X", text: "Morning Queen, now I gotta get ready for class, a 2 hour lecture of the laws of thermodynamics" },
  { type: "article", topic: "biology", source: "LearnScroll", text: "<strong>Photosynthesis and cellular respiration</strong><br><br>These two processes form the energy cycle of life. Photosynthesis captures light energy and stores it in glucose. Cellular respiration releases that stored energy as ATP.<br><br>Light-dependent reactions occur in the thylakoid membranes. The Calvin cycle happens in the stroma and fixes carbon dioxide into sugar. Oxygen is released as a byproduct.<br><br>Cellular respiration reverses the process through glycolysis, the Krebs cycle, and the electron transport chain." },
  { type: "article", topic: "thermodynamics", source: "LearnScroll", text: "<strong>The laws of thermodynamics</strong><br><br>First law: energy is conserved. It changes form but the total energy of an isolated system stays constant.<br><br>Second law: the entropy of an isolated system never decreases. Useful energy tends to spread out. This is why no heat engine can be 100% efficient.<br><br>Third law: the entropy of a perfect crystal approaches a minimum as temperature approaches absolute zero. Absolute zero itself cannot be reached." }
];

const feed = document.getElementById('feed');
const progressBar = document.getElementById('progressBar');
const counter = document.getElementById('counter');
const typeBtns = document.querySelectorAll('.filter-btn');
const topicBtns = document.querySelectorAll('.topic-btn');

let currentType = 'all';
let currentTopic = 'all';
let visibleItems = [...allItems];

const STORAGE_KEY = 'learnscroll-topics-v4';
let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
state.understood = state.understood || {};
state.saved = state.saved || {};

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function updateProgress(index) {
  const pct = visibleItems.length ? ((index + 1) / visibleItems.length) * 100 : 0;
  progressBar.style.width = pct + '%';
  counter.textContent = visibleItems.length ? `${index + 1} / ${visibleItems.length}` : '0 / 0';
  saveState();
}

function render() {
  feed.innerHTML = '';
  visibleItems = allItems.filter(item => {
    const typeOk = currentType === 'all' || item.type === currentType;
    const topicOk = currentTopic === 'all' || item.topic === currentTopic;
    return typeOk && topicOk;
  });

  if (visibleItems.length === 0) {
    feed.innerHTML = '<div class="card"><div class="card-inner"><div class="content">No content for this combination yet.</div></div></div>';
    updateProgress(0);
    return;
  }

  visibleItems.forEach((item) => {
    const originalIndex = allItems.indexOf(item);
    const el = document.createElement('div');
    el.className = `card ${item.type}` + (state.understood[originalIndex] ? ' understood' : '');
    el.dataset.index = originalIndex;
    const badgeText = item.type === 'post' ? 'Post' : 'Article';
    const topicLabel = item.topic.charAt(0).toUpperCase() + item.topic.slice(1);
    const source = item.source || 'LearnScroll';
    el.innerHTML = `
      <div class="card-inner">
        <div class="type-badge ${item.type}">${badgeText}</div>
        <div class="topic-tag">${topicLabel}</div>
        <div class="meta">
          <div class="avatar">LS</div>
          <div>learnscroll</div>
          <div class="source">${source}</div>
        </div>
        <div class="content">${item.text}</div>
        <div class="actions">
          <button class="action-btn ${state.saved[originalIndex] ? 'saved' : ''}" data-action="save">★</button>
          <button class="action-btn ${state.understood[originalIndex] ? 'done' : ''}" data-action="done">✓</button>
        </div>
      </div>
    `;
    feed.appendChild(el);
  });

  updateProgress(0);
  feed.scrollTop = 0;
}

typeBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    typeBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentType = btn.dataset.filter;
    render();
  });
});

topicBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    topicBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTopic = btn.dataset.topic;
    render();
  });
});

render();

let scrollTimeout;
feed.addEventListener('scroll', () => {
  clearTimeout(scrollTimeout);
  scrollTimeout = setTimeout(() => {
    const index = Math.round(feed.scrollTop / (feed.clientHeight || 1));
    if (index >= 0 && index < visibleItems.length) updateProgress(index);
  }, 60);
});

feed.addEventListener('click', (e) => {
  const btn = e.target.closest('.action-btn');
  if (!btn) return;
  const card = btn.closest('.card');
  const originalIndex = Number(card.dataset.index);
  const action = btn.dataset.action;

  if (action === 'done') {
    state.understood[originalIndex] = !state.understood[originalIndex];
    card.classList.toggle('understood', state.understood[originalIndex]);
    btn.classList.toggle('done', state.understood[originalIndex]);
  } else if (action === 'save') {
    state.saved[originalIndex] = !state.saved[originalIndex];
    btn.classList.toggle('saved', state.saved[originalIndex]);
  }
  saveState();
});

document.addEventListener('keydown', (e) => {
  const current = Math.round(feed.scrollTop / (feed.clientHeight || 1));
  if (e.key === 'ArrowDown' || e.key === ' ') {
    e.preventDefault();
    const next = Math.min(current + 1, visibleItems.length - 1);
    feed.children[next]?.scrollIntoView({ behavior: 'smooth' });
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    const prev = Math.max(current - 1, 0);
    feed.children[prev]?.scrollIntoView({ behavior: 'smooth' });
  }
});
</script>
</body>
</html>
